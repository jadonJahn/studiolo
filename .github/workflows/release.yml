name: Release

# Push a tag like v0.2.0 (matching the version in app/src-tauri/tauri.conf.json)
# to build the Windows installers and a draft GitHub release with update files.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    if: github.repository == 'jadonJahn/studiolo'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches app version
        shell: bash
        run: |
          v=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version v$v"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - run: npm ci
        working-directory: app
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files the in-app updater verifies (not Windows code signing).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          args: --config src-tauri/tauri.release.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: Studiolo ${{ github.ref_name }}
          releaseBody: |
            See [CHANGELOG.md](https://github.com/jadonJahn/studiolo/blob/main/CHANGELOG.md) for what's new.

            Download the `-setup.exe` below. The installer isn't code-signed yet, so Windows SmartScreen may warn the first time: choose **More info → Run anyway**. Installed copies update themselves from here.
          releaseDraft: true
          prerelease: false
