name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: In the app, open Settings → About → Copy diagnostics, then paste here. It includes your version, settings, and recent errors, never your sessions or tasks.
      render: text
  - type: dropdown
    id: where
    attributes:
      label: Where are you running it?
      options:
        - Windows desktop app
        - Web app (browser)
        - Built from source
